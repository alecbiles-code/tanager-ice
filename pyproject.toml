[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tanager-ice"
version = "0.1.0"
description = "Tanager hyperspectral snow/ice characterisation with conformal per-pixel uncertainty"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "requests>=2.28"]

[project.optional-dependencies]
io = ["h5py>=3.8", "xarray>=2023.1", "rasterio>=1.3"]
search = ["pystac-client>=0.7", "planetary-computer>=1.0", "earthaccess>=0.9", "shapely>=2.0"]
model = ["scikit-learn>=1.2"]

[tool.setuptools]
packages = ["tanager_ice"]
